<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 140" width="450" height="140">
  <g transform="translate(10, 10)">
    <!-- Kemenkes Cross Symbol -->
    <!-- Left horizontal petal (Teal) -->
    <path d="M 60 70 M 15 70 C 15 50 30 35 50 35 L 70 35 L 70 105 L 50 105 C 30 105 15 90 15 70 Z" fill="#00a89d" />
    
    <!-- Top vertical petal (Teal) -->
    <path d="M 70 35 C 70 15 85 0 105 0 C 125 0 140 15 140 35 L 140 70 L 70 70 Z" fill="#00a89d" />
    
    <!-- Bottom vertical petal (Teal) -->
    <path d="M 70 70 L 140 70 L 140 105 C 140 125 125 140 105 140 C 85 140 70 125 70 105 Z" fill="#00a89d" />
    
    <!-- Right top petal (Lime Green) -->
    <path d="M 140 70 L 140 0 C 160 0 175 15 175 35 C 175 55 160 70 140 70 Z" fill="#8cc63f" />
    
    <!-- Right bottom petal (Lime Green) -->
    <path d="M 140 70 L 175 70 C 175 90 160 105 140 105 Z" fill="#8cc63f" opacity="0.9" />

    <!-- Inner fold diagonal lines (white/light accents) -->
    <path d="M 70 70 L 140 0" stroke="#ffffff" stroke-width="3" />
    <path d="M 70 70 L 140 140" stroke="#ffffff" stroke-width="3" />
    <path d="M 70 70 L 175 70" stroke="#ffffff" stroke-width="3" />
    <path d="M 70 35 L 70 105" stroke="#ffffff" stroke-width="3" />
  </g>

  <!-- Kemenkes Text -->
  <g transform="translate(200, 38)" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="22" fill="#231f20" letter-spacing="0.5">
    <text x="0" y="0">KEMENTERIAN</text>
    <text x="0" y="24">KESEHATAN</text>
    <text x="0" y="48">REPUBLIK</text>
    <text x="0" y="72">INDONESIA</text>
  </g>
</svg>
